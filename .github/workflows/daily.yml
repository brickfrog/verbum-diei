name: Daily generate

on:
  schedule:
    # Runs daily; GitHub schedules use UTC.
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill a specific feed date (YYYY-MM-DD). Blank = latest feed item."
        required: false
        default: ""
      override:
        description: "Citation override(s) to correct upstream feed typos, as FROM=TO separated by ';'. e.g. Matthew 4:24-34=Matthew 6:24-34"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check for published branch
        id: published
        run: |
          branch=$(git ls-remote --heads origin refs/heads/gh-pages)
          if [[ -n "$branch" ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout published branch (gh-pages)
        if: steps.published.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: .published
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache spago packages
        uses: actions/cache@v4
        with:
          path: |
            .spago
            .cache
          key: spago-${{ runner.os }}-${{ hashFiles('spago.lock') }}
          restore-keys: spago-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Restore previously published days
        if: steps.published.outputs.exists == 'true'
        run: |
          mkdir -p public/data
          rsync -a .published/data/ public/data/

      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERBUM_OPENAI_MODEL: ${{ vars.VERBUM_OPENAI_MODEL }}
          # Empty on scheduled runs; set via workflow_dispatch to backfill/correct a day.
          VERBUM_DATE: ${{ inputs.date }}
          VERBUM_OVERRIDES: ${{ inputs.override }}
        run: |
          bun run preflight
          bun run generate

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
