name: Daily generate

on:
  schedule:
    # Runs daily; GitHub schedules use UTC.
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill a specific feed date (YYYY-MM-DD). Blank = latest feed item."
        required: false
        default: ""
      override:
        description: "Citation override(s) to correct upstream feed typos, as FROM=TO separated by ';'. e.g. Matthew 4:24-34=Matthew 6:24-34"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Checkout published branch (gh-pages)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: .published
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Restore previously published days
        run: |
          if [[ -d ".published/data" ]]; then
            echo "Restoring prior published days from gh-pages…"
            mkdir -p public/data
            rsync -a ".published/data/" "public/data/"
          else
            echo "No gh-pages branch yet; starting fresh."
          fi
          rm -rf public/d

      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERBUM_OPENAI_MODEL: ${{ vars.VERBUM_OPENAI_MODEL }}
          # Empty on scheduled runs; set via workflow_dispatch to backfill/correct a day.
          VERBUM_DATE: ${{ inputs.date }}
          VERBUM_OVERRIDES: ${{ inputs.override }}
        run: |
          bun run preflight
          bun run generate

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
